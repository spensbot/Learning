<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids Game</title>
    <meta name="description" content="A classic Asteroids arcade game built with TypeScript and Phaser 3">
